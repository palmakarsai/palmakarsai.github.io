<!DOCTYPE html>
<html lang="en" data-capo="" style="scroll-behavior: auto; touch-action: none;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Palma Karsai - Technical Director</title>
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('/assets/Paperlogy-1Thin-Dnz4PKhN.woff2') format('woff2'), url('fonts/Paperlogy-1Thin.woff') format('woff');
            font-weight: 100;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperlogy';
            src: url('/assets/Paperlogy-4Regular-C9s4Z-f-.woff2') format('woff2'), url('fonts/Paperlogy-4Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperlogy';
            src: url('/assets/Paperlogy-7Bold-CEGq1CUZ.woff2') format('woff2'), url('fonts/Paperlogy-7Bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <style>
      html, body {
            height: 100%;
            width: 100%;
            font-family: 'Paperlogy', sans-serif;
            line-height: 1.35;
            overflow: hidden;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .container{
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-columns: repeat(12, [col-start] 1fr);
        gap: 20px;
        z-index: 1;
      }

      @media (min-width: 768px) {
        .nav {
          grid-column: col-start / span 2;
          grid-row: 2 / 4;
        }
        .content {
          grid-column: col-start 2 / span 5;
          grid-row: 2 / 4;  
        }
         .main {
          grid-column: col-start 4 / span 6;
          grid-row: 2;
        }
        .sidebar {
          grid-column: col-start 11 / span 2;
        }
        .ads {
          grid-column: col-start 11 / span 2;
        }
        .footer {
          grid-column: col-start / span 12;
          text-align: center;
          color: #F0E7D5;
        }
        nav ul {
          flex-direction: column;
        }
      }

      .view-text{
        display: none;
        text-align: center;
        text-wrap: balance;
        font-size: large;
        opacity: 0;
        transition: opacity 0.1s linear, filter 0.1s linear; /* smooths the per-frame JS updates slightly */
        pointer-events: none; /* so faded/invisible text doesn't block clicks underneath */
      }
      .view-text.active { display: block; }
    </style>
    <script type="module" crossorigin src="/assets/index-x2g4vjob.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="ads">
        <button id="toggleTextureBtn">Switch Texture</button>
        <button id="toggleRenderBtn">Fix Render Issue</button>
        <button id="toggleCharacterBtn">Fix Skinning Issue</button>
      </div>
      <div class="footer">
        <div class="view-text" data-view="0">Scroll to explore</div>
      </div>
      <div class="content">
        <div class="view-text" data-view="1">Once upon a time, a little girl was born in Hungary.</div>
        <div class="view-text" data-view="2">When she grew older, she decided to try her luck in Norway.</div>
        <div class="view-text" data-view="3">She doesn't know where her journey will take her next, but she is excited about her next challenge.</div>
      </div>
      <div class="main">
        <div class="view-text" data-view="4" style="font-size: x-large">Hi! I'm Pálma and I help 3D artists.</div>
      </div>
    </div>
  </body>
</html>
